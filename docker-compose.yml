# Local infrastructure for the e-commerce microservices.
# The services themselves run with `mvn spring-boot:run` (see README).
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: serviceAdmin
      MYSQL_PASSWORD: serviceAdmin
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-userviceAdmin", "-pserviceAdmin", "-e", "SELECT 1"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"


volumes:
  mysql-data:
