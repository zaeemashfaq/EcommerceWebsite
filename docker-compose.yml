# Local infrastructure for the e-commerce microservices.
# The services themselves run with `mvn spring-boot:run` (see README).
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: serviceAdmin
      MYSQL_PASSWORD: serviceAdmin
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  mysql-data:
