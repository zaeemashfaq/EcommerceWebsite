server.port=${PORT:3000}

#FakeStore Config Values
fakestore.api.url = https://fakestoreapi.com
fakestore.api.paths.product = /products

#To prevent stacktrace from going outside
server.error.include-stacktrace=never

#Spring Data JPA
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/productservice?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:serviceAdmin}
spring.datasource.password=${DB_PASSWORD:serviceAdmin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=${SHOW_SQL:false}

#User Service used to validate tokens
userservice.url=${USER_SERVICE_URL:http://localhost:9000}

#Redis. For AWS, point REDIS_HOST to the ElastiCache endpoint
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
#Cache-aside for GET /products/{id}
product.cache.enabled=${PRODUCT_CACHE_ENABLED:true}
