server.port=${PORT:9000}
spring.jpa.hibernate.ddl-auto=update

#Local defaults. For AWS, set DB_URL to the RDS endpoint
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/userservice?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:serviceAdmin}
spring.datasource.password=${DB_PASSWORD:serviceAdmin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=${SHOW_SQL:false}

#HMAC key used to sign JWTs (min 32 bytes). Override in every non-local environment
jwt.secret=${JWT_SECRET:LOCAL_DEV_ONLY_JWT_SECRET_KEY_CHANGE_ME}
